<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0d1117; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-client" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="grad-mcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="grad-tools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <linearGradient id="grad-os" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Linux System MCP Server — System Architecture</text>
  <text x="500" y="62" text-anchor="middle" fill="#8b949e" font-size="13">High-Level Component Interaction &amp; Fallback Pipeline</text>

  <!-- Container Box 1: AI Agent Client -->
  <rect x="50" y="90" width="900" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="90" width="900" height="28" rx="8" fill="#21262d" />
  <text x="70" y="109" fill="#58a6ff" font-size="13" font-weight="bold">1. AI AGENT / LLM CLIENT LAYER</text>
  
  <rect x="70" y="128" width="250" height="40" rx="6" fill="url(#grad-client)" />
  <text x="195" y="153" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Claude Code / Desktop / Antigravity</text>

  <rect x="375" y="128" width="250" height="40" rx="6" fill="#21262d" stroke="#388bfd" stroke-width="1" />
  <text x="500" y="153" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">MCP JSON-RPC Protocol (Stdio)</text>

  <rect x="680" y="128" width="250" height="40" rx="6" fill="#21262d" stroke="#8957e5" stroke-width="1" />
  <text x="805" y="153" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="600">Defer Loading Meta-Tool Engine</text>

  <!-- Arrow Down -->
  <line x1="500" y1="180" x2="500" y2="210" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Container Box 2: MCP Server Core -->
  <rect x="50" y="215" width="900" height="200" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="215" width="900" height="28" rx="8" fill="#21262d" />
  <text x="70" y="234" fill="#1f6feb" font-size="13" font-weight="bold">2. LINUX SYSTEM MCP SERVER CORE (Node.js / TypeScript)</text>

  <!-- Core submodules -->
  <rect x="70" y="255" width="260" height="65" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="80" y="278" fill="#f0f6fc" font-size="13" font-weight="bold">Input Validation &amp; Coercion</text>
  <text x="80" y="296" fill="#8b949e" font-size="11">requireString, optionalNumber, Array validators</text>

  <rect x="370" y="255" width="260" height="65" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="380" y="278" fill="#f0f6fc" font-size="13" font-weight="bold">Session Environment Manager</text>
  <text x="380" y="296" fill="#8b949e" font-size="11">Resolves DISPLAY, WAYLAND, DBUS, XAUTHORITY</text>

  <rect x="670" y="255" width="260" height="65" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <text x="680" y="278" fill="#f0f6fc" font-size="13" font-weight="bold">Tool Router &amp; Registry</text>
  <text x="680" y="296" fill="#8b949e" font-size="11">Dispatches requests to 12+ specialized modules</text>

  <!-- Tool Handlers Bar -->
  <rect x="70" y="335" width="860" height="65" rx="6" fill="url(#grad-tools)" opacity="0.15" />
  <rect x="70" y="335" width="860" height="65" rx="6" fill="none" stroke="#8957e5" stroke-width="1" />
  <text x="85" y="358" fill="#d2a8ff" font-size="12" font-weight="bold">TOOL HANDLER MODULES:</text>
  <text x="85" y="380" fill="#f0f6fc" font-size="11">ask_user (Dialogs) | notify | shell_execute | sudo_execute (pkexec/askpass/su) | xdg_open | mouse | keyboard | screenshot | shell_background | log_read | backend_stats</text>

  <!-- Arrow Down -->
  <line x1="500" y1="415" x2="500" y2="445" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Container Box 3: OS Layer & Fallback Engine -->
  <rect x="50" y="450" width="900" height="170" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="450" width="900" height="28" rx="8" fill="#21262d" />
  <text x="70" y="469" fill="#f85149" font-size="13" font-weight="bold">3. OS INTEGRATION, GUI BACKENDS &amp; SYSTEM FALLBACK ENGINE</text>

  <rect x="70" y="490" width="200" height="115" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="80" y="512" fill="#58a6ff" font-size="12" font-weight="bold">KDE Plasma Backend</text>
  <text x="80" y="532" fill="#8b949e" font-size="11">• kdialog (Dialogs)</text>
  <text x="80" y="548" fill="#8b949e" font-size="11">• kdialog --passivepopup</text>
  <text x="80" y="564" fill="#8b949e" font-size="11">• kdialog --password</text>

  <rect x="295" y="490" width="200" height="115" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="305" y="512" fill="#7ee787" font-size="12" font-weight="bold">GTK / GNOME Backend</text>
  <text x="305" y="532" fill="#8b949e" font-size="11">• zenity (Dialogs)</text>
  <text x="305" y="548" fill="#8b949e" font-size="11">• notify-send (Libnotify)</text>
  <text x="305" y="564" fill="#8b949e" font-size="11">• dbus-send (Org.Notify)</text>

  <rect x="520" y="490" width="200" height="115" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="530" y="512" fill="#ffa657" font-size="12" font-weight="bold">Privilege Escalation</text>
  <text x="530" y="532" fill="#8b949e" font-size="11">• pkexec (PolicyKit GUI)</text>
  <text x="530" y="548" fill="#8b949e" font-size="11">• sudo -A (SUDO_ASKPASS)</text>
  <text x="530" y="564" fill="#8b949e" font-size="11">• su -c (Target User)</text>

  <rect x="745" y="490" width="185" height="115" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="755" y="512" fill="#d2a8ff" font-size="12" font-weight="bold">Automation &amp; Daemon</text>
  <text x="755" y="532" fill="#8b949e" font-size="11">• xdotool / ydotool</text>
  <text x="755" y="548" fill="#8b949e" font-size="11">• scrot / grim</text>
  <text x="755" y="564" fill="#8b949e" font-size="11">• Background SQLite DB</text>
</svg>
